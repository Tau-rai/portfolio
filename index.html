      // Apply the saved theme before first paint to avoid a flash; dark is the default.
      try {
        if (localStorage.getItem("taurai-portfolio-theme") === "light") {
          document.documentElement.classList.replace("dark", "light");

    <script type="application/ld+json">

        "jobTitle": "Full Stack Software Developer",
        "address": { "@type": "PostalAddress", "addressLocality": "Johannesburg", "addressCountry": "ZA" },

    </script>
